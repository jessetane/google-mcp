<!DOCTYPE html>
<html>
	<head>
		<meta charset=utf-8>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>google-mcp sign in</title>
		<style>
			* {
				box-sizing: border-box;
			}

			html {
				height: 100%;
			}

			body {
				margin: 0;
				height: 100%;
				font-family: sans-serif;
			}

			.column {
				display: flex;
				flex-direction: column;
			}

			.view {
				margin: auto;
				width: 100%;
				padding: 24px;
			}

			@media (min-width: 520px) {
				.view {
					max-width: 480px;
				}
			}

			h1 {
				font-size: 1.5rem;
				text-align: center;
				margin-top: 0.85rem;
				margin-bottom: 0.85rem;
			}

			.subtitle {
				color: #555;
				font-size: 0.95rem;
				line-height: 1.4;
				text-align: center;
				margin: 0;
				margin-bottom: 0.75rem;
			}

			.table {
				width: 100%;
				border-collapse: collapse;
				margin-bottom: 1rem;
				font-size: 0.9rem;
			}

			.table th {
				text-align: left;
				padding: 8px 6px;
				border-bottom: 2px solid #ccc;
			}

			.table td {
				padding: 8px 6px;
				border-bottom: 1px solid #eee;
			}

			.table tr:hover {
				background: #fafafa;
			}

			.col-check {
				text-align: center;
				width: 60px;
			}

			.col-check input:disabled {
				opacity: 0.35;
				cursor: not-allowed;
			}

			.enterprise-mark {
				color: #000;
				font-weight: bold;
			}

			.footnote {
				font-size: 0.78rem;
				color: #666;
				line-height: 1.4;
				margin-bottom: 1.5rem;
			}

			button[type=submit] {
				width: 100%;
				padding: 11px 16px;
				background: #000;
				color: #fff;
				border: none;
				border-radius: 6px;
				font-size: 1rem;
				cursor: pointer;
				margin-bottom: 1.5rem;
			}

			button[type=submit]:hover {
				opacity: 0.85;
			}
		</style>
	</head>
	<body class=column>
		<div class="view column">
			<h1>google-mcp</h1>
			<p class="subtitle">Configure API services access</p>
			<form id="consent-form" method="POST" action="/oauth/authorize/consent">
				<div id="hidden-inputs"></div>
				<table class="table">
					<thead>
						<tr>
							<th>Service</th>
							<th class="col-check">Read</th>
							<th class="col-check">Write</th>
						</tr>
					</thead>
					<tbody id="service-rows">
						<tr id="row-all">
							<td><strong>All</strong></td>
							<td class="col-check"><input type="checkbox" id="all-read"></td>
							<td class="col-check"><input type="checkbox" id="all-write" disabled></td>
						</tr>
					</tbody>
				</table>
				<div class="footnote">
					<span class="enterprise-mark">*</span> Restricted to enterprise Google Workspace accounts with domain-wide delegation. Requests from personal accounts will fail if selected.
				</div>
				<button type="submit">Sign in with Google</button>
			</form>
		</div>
		<script>
			const initData = {{INIT_DATA}}

			function updateAllRowState () {
				const allRead = document.getElementById('all-read')
				const allWrite = document.getElementById('all-write')
				if (!allRead || !allWrite) return
				const services = document.querySelectorAll('input[name="services"]')
				if (services.length === 0) return
				let readCount = 0
				let writeCount = 0
				let eligibleWriteCount = 0
				for (const s of services) {
					const id = s.value
					const w = document.getElementById('wr_' + id)
					if (s.checked) {
						readCount++
						eligibleWriteCount++
						if (w && w.checked) writeCount++
					}
				}
				allRead.checked = readCount === services.length
				allRead.indeterminate = readCount > 0 && readCount < services.length
				allWrite.disabled = readCount === 0
				if (readCount === 0) {
					allWrite.checked = false
					allWrite.indeterminate = false
				} else {
					allWrite.checked = eligibleWriteCount > 0 && writeCount === eligibleWriteCount
					allWrite.indeterminate = writeCount > 0 && writeCount < eligibleWriteCount
				}
			}

			function onServiceToggle (id) {
				const s = document.getElementById('svc_' + id)
				const w = document.getElementById('wr_' + id)
				if (!s || !w) return
				w.disabled = !s.checked
				if (!s.checked) w.checked = false
				updateAllRowState()
			}

			function init () {
				const hiddenContainer = document.getElementById('hidden-inputs')
				for (const [key, value] of Object.entries(initData.params || {})) {
					const input = document.createElement('input')
					input.type = 'hidden'
					input.name = key
					input.value = value
					hiddenContainer.appendChild(input)
				}
				const tbody = document.getElementById('service-rows')
				for (const s of (initData.services || [])) {
					const tr = document.createElement('tr')
					const tdSvc = document.createElement('td')
					const spanName = document.createElement('span')
					spanName.textContent = s.name
					if (s.enterprise) {
						const mark = document.createElement('span')
						mark.className = 'enterprise-mark'
						mark.textContent = ' *'
						spanName.appendChild(mark)
					}
					tdSvc.appendChild(spanName)

					const tdRead = document.createElement('td')
					tdRead.className = 'col-check'
					const inputSvc = document.createElement('input')
					inputSvc.type = 'checkbox'
					inputSvc.name = 'services'
					inputSvc.id = 'svc_' + s.id
					inputSvc.value = s.id
					inputSvc.setAttribute('data-enterprise', s.enterprise ? '1' : '0')
					inputSvc.checked = !s.enterprise
					inputSvc.addEventListener('change', function () {
						onServiceToggle(s.id)
					})
					tdRead.appendChild(inputSvc)

					const tdWrite = document.createElement('td')
					tdWrite.className = 'col-check'
					const inputWr = document.createElement('input')
					inputWr.type = 'checkbox'
					inputWr.name = 'write_' + s.id
					inputWr.id = 'wr_' + s.id
					inputWr.value = '1'
					inputWr.disabled = !inputSvc.checked
					inputWr.addEventListener('change', function () {
						updateAllRowState()
					})
					tdWrite.appendChild(inputWr)

					tr.appendChild(tdSvc)
					tr.appendChild(tdRead)
					tr.appendChild(tdWrite)
					tbody.appendChild(tr)
				}

				const allRead = document.getElementById('all-read')
				const allWrite = document.getElementById('all-write')
				if (allRead) {
					allRead.addEventListener('click', function () {
						const checked = allRead.checked
						const services = document.querySelectorAll('input[name="services"]')
						for (const s of services) {
							const id = s.value
							s.checked = checked
							const w = document.getElementById('wr_' + id)
							if (w) {
								w.disabled = !s.checked
								if (!s.checked) w.checked = false
							}
						}
						updateAllRowState()
					})
				}
				if (allWrite) {
					allWrite.addEventListener('click', function () {
						const checked = allWrite.checked
						const services = document.querySelectorAll('input[name="services"]')
						for (const s of services) {
							const id = s.value
							const w = document.getElementById('wr_' + id)
							if (w && s.checked) {
								w.checked = checked
							}
						}
						updateAllRowState()
					})
				}
				updateAllRowState()
			}

			init()
		</script>
	</body>
</html>
